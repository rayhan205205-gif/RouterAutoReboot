plugins {
    id 'com.android.application'
}

android {
    namespace 'com.router.autoreboot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.router.autoreboot'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
